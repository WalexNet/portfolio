{% extends "base.html" %}
{% block content %}


<!-- ======= Blog Hero ======= -->
<section id="blog-hero" class="dark-background">
</section>

<!-- ======= Blog Section ======= -->
<section id="blog" class="blog section">
  <div class="container" data-aos="fade-up">

    <h1 class="mb-3">{{ post.title }}</h1>

    <div class="text-muted mb-4">
      <i class="bi bi-calendar"></i>
      {{ post.created_at.strftime('%d %B %Y') }}
    </div>

    {% if post.tags %}
    <div class="mb-4">
      {% for tag in post.tags %}
      <a href="{{ url_for('blog.by_tag', name=tag.name) }}" class="badge bg-secondary text-decoration-none me-1">{{ tag.name }}</a>
      {% endfor %}
    </div>
    {% endif %}

    <div class="post-wrapper">
      <div class="post-content markdown-body">
          {{ content_html | safe }}
      </div>
    </div>
    <!-- Las siguientes lineas de etiquetas script son para renderizar graficos mermaid -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

      mermaid.initialize({
        startOnLoad: false, // Desactivamos el auto-render global
        theme: 'default',
        securityLevel: 'loose'
      });

      // Renderizado manual dirigido a los bloques de Mistune
      async function renderMermaid() {
        const blocks = document.querySelectorAll('pre code.language-mermaid');
        for (const block of blocks) {
          const parent = block.parentElement;
          // Creamos un nuevo div con la clase 'mermaid' que es lo que la librería espera
          const container = document.createElement('div');
          container.className = 'mermaid';
          container.textContent = block.textContent;

          // Reemplazamos el <pre> original por el div que Mermaid puede procesar
          parent.replaceWith(container);
        }

        // Ejecutamos el renderizado sobre los nuevos elementos
        await mermaid.run({
          querySelector: '.mermaid'
        });
      }

      // Ejecutar cuando el DOM esté listo
      document.addEventListener('DOMContentLoaded', renderMermaid);
    </script>
  </div>
</section>



{% endblock %}
