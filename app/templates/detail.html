{% extends "base.html" %}
{% block content %}


<!-- ======= Blog Hero ======= -->
<section id="blog-hero" class="dark-background">
</section>

<!-- ======= Blog Section ======= -->
<section id="blog" class="blog section">
  <div class="container" data-aos="fade-up">

    <h1 class="mb-3">{{ post.title }}</h1>

    <div class="text-muted mb-4">
      <i class="bi bi-calendar"></i>
      {{ post.created_at.strftime('%d %B %Y') }}
    </div>

    {% if post.tags %}
    <div class="mb-4">
      {% for tag in post.tags %}
      <a href="{{ url_for('blog.by_tag', name=tag.name) }}" class="badge bg-secondary text-decoration-none me-1">{{ tag.name }}</a>
      {% endfor %}
    </div>
    {% endif %}

    <div class="post-wrapper">
      <div class="post-content markdown-body">
          {{ content_html | safe }}
      </div>
    </div>

  </div>
</section>

{% endblock %}
