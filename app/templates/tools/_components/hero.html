<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/tool-common.css', v='2') }}"
>

<section class="hero hero-inner section dark-background tool-hero">
  <div class="container">
    <div class="row align-items-center">

      <div class="col-lg-3 d-none d-lg-block">
        <div class="tool-hero-graphic" aria-hidden="true">
          <div class="tool-hero-symbol">
            <i class="bi {{ tool_icon }}"></i>
          </div>

          <span class="tool-hero-node node-one"></span>
          <span class="tool-hero-node node-two"></span>
          <span class="tool-hero-node node-three"></span>
          <span class="tool-hero-node node-four"></span>
        </div>
      </div>

      <div class="col-lg-9">
        <div class="tool-hero-content text-center">
          <h1>{{ tool_title }}</h1>
          <p>{{ tool_description }}</p>
        </div>
      </div>

    </div>
  </div>
</section>
